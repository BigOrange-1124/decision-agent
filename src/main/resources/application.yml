# ========================================
# 决策 Agent 应用配置文件
# ========================================

# -----------------
# 服务器配置
# -----------------
server:
  port: 8199  # 应用监听端口

# -----------------
# Spring 基础配置
# -----------------
spring:
  application:
    name: decision-agent  # 应用名称

  # JSON 序列化配置
  jackson:
    default-property-inclusion: non_null  # 只包含非 null 的属性（减少响应体积）
    serialization:
      indent_output: true  # 美化 JSON 输出（便于开发调试）

# -----------------
# 大语言模型（LLM）配置
# -----------------
# 支持 OpenAI 和智谱AI（兼容 OpenAI API 格式）
llm:
  # API 密钥（必填）
  # 支持环境变量：ZHIPU_API_KEY 或 OPENAI_API_KEY
  api-key: c1b1c690e1974f8b84312ae41145ebd2.X7gTmeJNhpKiSSNW

  # API 基础地址（可选）
  # 留空：使用 OpenAI 官方地址
  # 设置后：使用自定义 endpoint（例如智谱AI）
  # 智谱AI: https://open.bigmodel.cn/api/paas/v4
  # 注意：LangChain4j 会自动添加 /chat/completions 路径
  base-url: https://open.bigmodel.cn/api/paas/v4

  # 模型名称
  # OpenAI 可选：gpt-4, gpt-4o-mini, gpt-3.5-turbo
  # 智谱AI 可选：glm-4-flash, glm-4-plus, glm-4-0520, glm-4.7-flash
  model-name: glm-4-flash

  # 生成参数
  temperature: 0.7      # 温度参数（0.0-1.0），控制输出的随机性
  max-tokens: 8000      # 单次响应的最大 token 数量
  timeout: 1200         # API 请求超时时间（秒）

# -----------------
# 日志配置
# -----------------
logging:
  level:
    com.decisionagent: DEBUG    # 应用日志级别（开发环境用 DEBUG）
    dev.langchain4j: INFO       # LangChain4j 框架日志级别
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"  # 日志输出格式
