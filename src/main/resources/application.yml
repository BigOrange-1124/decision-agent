server:
  port: 8099

spring:
  application:
    name: decision-agent

  # JSON configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      indent_output: true

# LLM Configuration
# 支持OpenAI和智谱AI（兼容OpenAI格式）
llm:
  # API Key (支持环境变量: ZHIPU_API_KEY 或 OPENAI_API_KEY)
  api-key: c1b1c690e1974f8b84312ae41145ebd2.X7gTmeJNhpKiSSNW

  # Base URL (留空使用OpenAI，设置后使用自定义endpoint)
  # 智谱AI: https://open.bigmodel.cn/api/paas/v4 (LangChain4j会自动添加/chat/completions)
  base-url: https://open.bigmodel.cn/api/paas/v4
  # Model name
  # OpenAI: gpt-4, gpt-4o-mini, gpt-3.5-turbo
  # 智谱AI: glm-4-flash, glm-4-plus, glm-4-0520
  model-name: glm-4.7-flash

  # Generation parameters
  temperature: 0.7
  max-tokens: 8000
  timeout: 1200

# Logging
logging:
  level:
    com.decisionagent: DEBUG
    dev.langchain4j: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
