server:
  port: 8080

spring:
  application:
    name: decision-agent

  jackson:
    default-property-inclusion: non_null
    serialization:
      indent_output: true

# LLM Configuration - 智谱AI
llm:
  api-key: ${ZHIPU_API_KEY:c1b1c690e1974f8b84312ae41145ebd2.X7gTmeJNhpKiSSNW}
  base-url: https://open.bigmodel.cn/api/paas/v4
  model-name: glm-4-flash
  temperature: 0.7
  max-tokens: 8000
  timeout: 1200

# Logging
logging:
  level:
    root: INFO
    com.decisionagent: DEBUG
    dev.langchain4j: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
